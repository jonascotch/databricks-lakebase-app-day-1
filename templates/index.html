<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Massive Stock Watchlist</title>
  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #4f46e5;
      --accent-strong: #4338ca;
      --accent-soft: #eef2ff;
      --success-bg: #ecfdf5;
      --success-ink: #047857;
      --success-border: #a7f3d0;
      --error-bg: #fef2f2;
      --error-ink: #b91c1c;
      --error-border: #fecaca;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 45%);
      min-height: 100vh;
      margin: 0;
      padding: 48px 16px;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.5;
    }
    .card {
      max-width: 680px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 45px -25px rgba(15, 23, 42, 0.25);
      padding: 32px;
    }
    h1 { font-size: 22px; letter-spacing: -0.01em; margin: 0; }
    .hint { color: var(--muted); font-size: 13.5px; margin: 6px 0 0; max-width: 52ch; }
    label { display: block; margin-top: 24px; font-weight: 600; font-size: 13px; letter-spacing: 0.02em; }
    input[type="text"] {
      width: 100%;
      padding: 11px 14px;
      margin-top: 8px;
      font-size: 15px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    button {
      margin-top: 16px;
      padding: 11px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #6366f1, var(--accent));
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 8px 18px -8px rgba(79, 70, 229, 0.7);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 10px 22px -8px rgba(79, 70, 229, 0.8); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.6; cursor: wait; transform: none; }
    #result {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      white-space: pre-wrap;
      background: #f1f5f9;
      color: var(--muted);
      border: 1px solid transparent;
    }
    #result:empty { display: none; }
    #result.ok { background: var(--success-bg); color: var(--success-ink); border-color: var(--success-border); }
    #result.err { background: var(--error-bg); color: var(--error-ink); border-color: var(--error-border); }
    table { width: 100%; margin-top: 28px; border-collapse: collapse; font-size: 14px; }
    thead th {
      text-align: left;
      padding: 10px 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 2px solid var(--border);
    }
    tbody td { padding: 12px; border-bottom: 1px solid var(--border); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.12s ease; }
    tbody tr:hover { background: var(--accent-soft); }
    #watchlist-body td:first-child { font-weight: 700; color: var(--accent-strong); letter-spacing: 0.03em; }
    #watchlist-body td:nth-child(3) { font-variant-numeric: tabular-nums; }
    #watchlist-body td:nth-child(4) { color: var(--muted); font-size: 13px; }
    .empty-row td { text-align: center; color: var(--muted); padding: 28px 12px; }
    #watchlist-body td:last-child { width: 1%; text-align: right; }
    #watchlist-body tr.empty-row td { text-align: center; }
    .delete-btn {
      padding: 6px 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--error-ink);
      background: #fff;
      border: 1px solid var(--error-border);
      border-radius: 8px;
      cursor: pointer;
      margin: 0;
      box-shadow: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .delete-btn:hover { background: var(--error-bg); border-color: #fca5a5; transform: none; box-shadow: none; }
    .delete-btn:active { transform: none; }
    .delete-btn:disabled { opacity: 0.6; cursor: wait; }
    @media (max-width: 560px) {
      .card { padding: 22px; }
      tbody td, thead th { padding: 8px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Stock Watchlist</h1>
    <p class="hint">Enter a single ticker symbol. This sends exactly ONE call to the Massive API to fetch the latest price, then adds it to your watchlist.</p>

  <form id="stock-form">
    <label for="symbol">Ticker symbol</label>
    <input type="text" id="symbol" name="symbol" placeholder="AAPL" required>
    <button type="submit">Add to watchlist</button>
  </form>

  <div id="result"></div>

  <table id="watchlist-table">
    <thead>
      <tr>
        <th>Symbol</th>
        <th>Email</th>
        <th>Latest price</th>
        <th>Updated</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="watchlist-body"></tbody>
  </table>
  </main>

  <script>
    const form = document.getElementById("stock-form");
    const resultEl = document.getElementById("result");
    const watchlistBody = document.getElementById("watchlist-body");

    async function loadWatchlist() {
      try {
        const resp = await fetch("/watchlist");
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.className = "err";
          resultEl.textContent = "Error loading watchlist: " + (data.error || resp.statusText);
          return;
        }
        watchlistBody.innerHTML = "";
        if (!data.length) {
          watchlistBody.innerHTML = '<tr class="empty-row"><td colspan="5">Your watchlist is empty — add your first ticker above.</td></tr>';
          return;
        }
        data.forEach((row) => {
          const tr = document.createElement("tr");
          const price = row.latest_price !== null && row.latest_price !== undefined
            ? Number(row.latest_price).toFixed(2)
            : "-";
          const updated = row.updated_at ? new Date(row.updated_at).toLocaleString() : "-";
          tr.innerHTML = `<td>${row.symbol}</td><td>${row.email || "-"}</td><td>${price}</td><td>${updated}</td><td><button class="delete-btn" data-symbol="${row.symbol}" aria-label="Remove ${row.symbol}">Remove</button></td>`;
          watchlistBody.appendChild(tr);
        });
      } catch (err) {
        resultEl.className = "err";
      resultEl.textContent = "Failed to load watchlist: " + err;
      }
    }

    watchlistBody.addEventListener("click", async (e) => {
      const btn = e.target.closest(".delete-btn");
      if (!btn) return;
      const symbol = btn.getAttribute("data-symbol");
      btn.disabled = true;
      resultEl.className = "";
      resultEl.textContent = "Removing " + symbol + "...";

      try {
        const resp = await fetch("/watchlist/" + encodeURIComponent(symbol), { method: "DELETE" });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.className = "err";
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          btn.disabled = false;
          return;
        }
        resultEl.className = "ok";
        resultEl.textContent = "Removed " + symbol + " from your watchlist.";
        loadWatchlist();
      } catch (err) {
        resultEl.className = "err";
        resultEl.textContent = "Request failed: " + err;
        btn.disabled = false;
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value;
      const submitBtn = form.querySelector("button");
      submitBtn.disabled = true;
      resultEl.className = "";
      resultEl.textContent = "Adding to watchlist...";

      try {
        const resp = await fetch("/watchlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.className = "err";
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          return;
        }
        resultEl.className = "ok";
        resultEl.textContent = "Added " + data.symbol + " at price " + data.latest_price;
        document.getElementById("symbol").value = "";
        loadWatchlist();
      } catch (err) {
        resultEl.className = "err";
        resultEl.textContent = "Request failed: " + err;
      } finally {
        submitBtn.disabled = false;
      }
    });

    loadWatchlist();
  </script>
</body>
</html>
